# HubMembership (multihub fork): which Argo CD hubs are members of a
# multi-hub group and in which state. One object named "default" in the
# argocd namespace, identical on every hub (synced from Git by each hub's
# root app). The status is each hub's own view.
# See docs/proposals/multi-hub-active-active.md, "Membership and voting".
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hubmemberships.multihub.argoproj.io
  labels:
    app.kubernetes.io/name: hubmemberships.multihub.argoproj.io
    app.kubernetes.io/part-of: argocd
spec:
  group: multihub.argoproj.io
  scope: Namespaced
  names:
    kind: HubMembership
    listKind: HubMembershipList
    plural: hubmemberships
    singular: hubmembership
    shortNames: [hubm]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: This-Hub, type: string, jsonPath: .status.hub.id}
        - {name: State, type: string, jsonPath: .status.hub.state}
        - {name: Members, type: integer, jsonPath: .status.activeMembers}
        - {name: Quorum, type: integer, jsonPath: .status.quorum}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [members]
              properties:
                refreshPeriod:
                  description: Periodic refresh period on every hub, read live. Combinations of <n>d, <n>h, <n>m, <n>s (e.g. 120s, 2m). Not 0.
                  type: string
                  pattern: '^([0-9]+[dhms])+$'
                forgetAfter:
                  description: How long a silent member hub keeps counting toward votes. "0" = never forget (retire it by changing this resource). Combinations of <n>d, <n>h, <n>m, <n>s (e.g. 7d, 1d12h, 90m).
                  type: string
                  pattern: '^(0|([0-9]+[dhms])+)$'
                members:
                  description: Hubs that are members, by id or by label selector on the hub's own cluster self-registration. An id entry overrides a selector match.
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [state]
                    x-kubernetes-validations:
                      - rule: has(self.id) != has(self.selector)
                        message: each member needs exactly one of id or selector
                    properties:
                      id:
                        description: A hub id (ARGOCD_MULTIHUB_HUB_ID).
                        type: string
                        minLength: 1
                      selector:
                        description: A label selector on the hub's own cluster Secret (server https://kubernetes.default.svc).
                        type: object
                        properties:
                          matchLabels:
                            type: object
                            additionalProperties: {type: string}
                          matchExpressions:
                            type: array
                            items:
                              type: object
                              required: [key, operator]
                              properties:
                                key: {type: string}
                                operator: {type: string, enum: [In, NotIn, Exists, DoesNotExist]}
                                values: {type: array, items: {type: string}}
                      state:
                        description: active votes and does the work; watching reports its view but doesn't sync, share or vote.
                        type: string
                        enum: [active, watching]
            status:
              description: This hub's view (each hub has its own copy of the object).
              type: object
              x-kubernetes-preserve-unknown-fields: true
