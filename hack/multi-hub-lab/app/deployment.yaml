apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-pause
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-pause
  template:
    metadata:
      labels:
        app: lab-pause
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
