apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-pause
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-pause
  template:
    metadata:
      labels:
        app: lab-pause
      annotations:
        # rollout.sh bumps this to force a rollout; with the readiness delay
        # below, the sync waits in wave 0 (Deployment progressing) before it
        # applies wave 1 (the ConfigMap): a long sync phase, for C3 tests.
        lab/rollout: "2"
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: busybox:1.36
          command: ["sleep", "1000000"]
          readinessProbe:
            exec:
              command: ["true"]
            initialDelaySeconds: 5
            periodSeconds: 2
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
